<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <!-- LEFT -->
    <div class="left">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
        alt="Instagram logo"
        class="logo"
      />
      <h1>See everyday moments from your</h1>
      <h2><span>close friends</span>.</h2>
      <img
        src=""
        alt=""
        class="preview"
      />
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="login-box">
        <h3>Log into Instagram</h3>

        <form action="/login" method="POST">
          <input
            type="text"
            name="username"
            placeholder="Mobile number, username or email"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <button type="submit">Log in</button>
        </form>

        <p class="forgot">Forgot password?</p>

        <div class="divider"></div>

        <button class="facebook">Log in with Facebook</button>

        <p class="signup">Create new account</p>
        <p class="meta">Meta</p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>Meta</span>
    <span>About</span>
    <span>Blog</span>
    <span>Jobs</span>
    <span>Help</span>
    <span>Privacy</span>
    <span>Terms</span>
  </div>

</body>
</html>
